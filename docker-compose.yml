services:
  spectra:
    build: .
    image: spectra-observability:local
    container_name: spectra
    ports:
      - "8000:8000"
    environment:
      DUCKDB_PATH: /app/data/spectra.duckdb
      DATA_DIR: /app/data/imports
      DASHBOARD_DIR: /app/data/dashboards
      SPECTRA_JWT_SECRET: ${SPECTRA_JWT_SECRET:-replace-me-in-production}
      SPECTRA_INGEST_API_KEY: ${SPECTRA_INGEST_API_KEY:-}
      SPECTRA_BOOTSTRAP_PASSWORD: ${SPECTRA_BOOTSTRAP_PASSWORD:-}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      DATABASE_URL: ${DATABASE_URL:-postgresql://spectra:spectra@postgres:5432/spectra}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
    volumes:
      - spectra-data:/app/data
      - ./provisioning:/app/provisioning:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 15s
  demo-stream:
    image: python:3.12-slim
    container_name: spectra-demo-stream
    depends_on:
      spectra:
        condition: service_healthy
    volumes:
      - ./scripts/demo_stream.py:/app/demo_stream.py:ro
    environment:
      SPECTRA_INGEST_URL: http://spectra:8000/api/v1/ingest
      SPECTRA_INGEST_API_KEY: ${SPECTRA_INGEST_API_KEY:-}
    command: ["python", "-u", "/app/demo_stream.py"]
    restart: unless-stopped
volumes:
  spectra-data:
