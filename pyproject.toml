[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-observability"
version = "0.1.0"
description = "Intelligent open-source telemetry and observability platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "duckdb>=1.1,<2", "polars>=1.15,<2", "httpx>=0.27,<1", "asyncpg>=0.30,<1", "python-jose[cryptography]>=3.3,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["backend*"]
